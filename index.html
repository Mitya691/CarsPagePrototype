<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Автомобили — интерактивный прототип</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <svg class="svg-sprite" aria-hidden="true">
      <symbol id="i-car" viewBox="0 0 24 24"><path d="M5 17h14l-1-7a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2l-1 7Z"/><path d="M3 14h18v5H3z"/><circle cx="7" cy="19" r="2"/><circle cx="17" cy="19" r="2"/><path d="M7 8 9 5h6l2 3M6 14h2m8 0h2"/></symbol>
      <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3-9 5 9 5 9-5-9-5Z"/><path d="m3 12 9 5 9-5M3 16l9 5 9-5"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
      <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
      <symbol id="i-code" viewBox="0 0 24 24"><path d="m8 9-4 3 4 3m8-6 4 3-4 3m-2-9-4 12"/></symbol>
      <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
      <symbol id="i-wrench" viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5-5L7 4l3 3-3 3-3-3-2.7 2.7a4 4 0 0 0 5 5L16 24l8-8-9.3-9.7Z"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 21h16"/></symbol>
      <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16m8-10-3 2 3 2"/></symbol>
      <symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 17l5-5-5-5m5 5H3m12-9h5a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1h-5"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21h-4v-.09A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3v-4h.09A1.7 1.7 0 0 0 4.6 8.6a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3h4v.09A1.7 1.7 0 0 0 15.4 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 .6 1 1.7 1.7 0 0 0 1.1.4h.09v4h-.09a1.7 1.7 0 0 0-1.7.6Z"/></symbol>
      <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="m12 3 1.2 4.3L17.5 9l-4.3 1.7L12 15l-1.2-4.3L6.5 9l4.3-1.7L12 3ZM5 15l.7 2.3L8 18l-2.3.7L5 21l-.7-2.3L2 18l2.3-.7L5 15Zm14-5 .8 2.2L22 13l-2.2.8L19 16l-.8-2.2L16 13l2.2-.8L19 10Z"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 2.7 2.9 5.9 6.5.9-4.7 4.6 1.1 6.5-5.8-3.1-5.8 3.1 1.1-6.5-4.7-4.6 6.5-.9L12 2.7Z"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
      <symbol id="i-activity" viewBox="0 0 24 24"><path d="M3 12h4l2-7 4 14 2-7h6"/></symbol>
      <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M12 20h.01M2 9a15 15 0 0 1 20 0"/></symbol>
      <symbol id="i-wifi-off" viewBox="0 0 24 24"><path d="m3 3 18 18M8.5 16a5 5 0 0 1 4.6-1.4M5 12.5a10 10 0 0 1 3.3-2.1M2 9a15 15 0 0 1 3.8-2.2M12 20h.01M19 12.5a10 10 0 0 0-5.6-2.8M22 9a15 15 0 0 0-10.3-3.8"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
      <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></symbol>
      <symbol id="i-fuel" viewBox="0 0 24 24"><path d="M4 21V4a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v17M3 21h14M7 7h5v5H7zM15 7h2l3 3v8a2 2 0 0 1-4 0v-3"/></symbol>
      <symbol id="i-battery" viewBox="0 0 24 24"><rect x="2" y="7" width="18" height="10" rx="2"/><path d="M22 11v2M6 10v4m-2-2h4"/></symbol>
      <symbol id="i-gauge" viewBox="0 0 24 24"><path d="M4 18a9 9 0 1 1 16 0M8 18h8M12 12l4-4"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
      <symbol id="i-unlock" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 7.5-2"/></symbol>
      <symbol id="i-signal" viewBox="0 0 24 24"><path d="M4 20v-3m5 3v-7m5 7V9m5 11V4"/></symbol>
      <symbol id="i-map" viewBox="0 0 24 24"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3V6Z"/><path d="M9 3v15m6-12v15"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18m-2 0-1 15H6L5 6m3 0V3h8v3M10 10v7m4-7v7"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2 5.5M20 4v7h-7"/></symbol>
      <symbol id="i-clipboard" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2h6v2M9 9h6m-6 4h6m-6 4h4"/></symbol>
    </svg>

    <div class="desktop-shell">
      <aside class="sidebar">
        <div class="sidebar-main">
          <div class="brand"><span>СИТИ</span><strong>ДРАЙВ</strong></div>
          <nav id="main-nav" aria-label="Основное меню"></nav>
        </div>
        <button class="collapse-menu" data-action="collapse-menu"><svg><use href="#i-panel"/></svg><span>Свернуть меню</span></button>
        <button class="profile" data-action="profile"><span>Севрюков (дизайнер продукта) Д.И.</span><svg><use href="#i-logout"/></svg></button>
      </aside>

      <main class="workspace">
        <section class="toolbar-card">
          <div class="heading-row">
            <div class="heading-group">
              <h1>Автомобили</h1>
              <select id="scope-select" aria-label="Фильтр доступности">
                <option value="all">Все</option>
                <option value="available">Доступные</option>
                <option value="unavailable">Недоступные</option>
              </select>
            </div>
            <div class="view-tabs" role="tablist">
              <button class="active" data-view="list" role="tab">Список</button>
              <button data-view="map" role="tab">На карте</button>
              <button data-view="downtime" role="tab">Карта простоев</button>
            </div>
            <button class="icon-button settings" data-action="settings" aria-label="Настройки"><svg><use href="#i-settings"/></svg></button>
          </div>

          <div class="search-row">
            <div class="search-composer" id="search-composer">
              <div class="search-field" id="search-field">
                <svg class="search-icon"><use href="#i-sparkle"/></svg>
                <div id="active-chips" class="active-chips"></div>
                <input id="smart-search" autocomplete="off" placeholder="Поиск — например: Geely в Москве, топлива меньше 25%" />
                <button id="clear-query" class="clear-query hidden" aria-label="Очистить запрос"><svg><use href="#i-x"/></svg></button>
              </div>
              <div id="search-popover" class="search-popover hidden"></div>
            </div>
            <div class="more-wrap">
              <button class="icon-button" id="more-button" aria-label="Дополнительные действия"><svg><use href="#i-more"/></svg></button>
              <div id="more-menu" class="more-menu hidden">
                <button data-action="refresh"><svg><use href="#i-refresh"/></svg>Обновить данные</button>
                <button data-action="export"><svg><use href="#i-download"/></svg>Экспортировать список</button>
                <button data-action="columns"><svg><use href="#i-settings"/></svg>Настроить колонки</button>
              </div>
            </div>
            <button class="icon-button save-selection" id="save-selection" disabled data-tooltip="Сохранить выборку" aria-label="Сохранить выборку"><svg><use href="#i-star"/></svg></button>
            <button class="reset-button" id="reset-button" disabled>Сбросить</button>
          </div>
        </section>

        <section id="metrics" class="metrics" aria-label="Показатели автопарка"></section>
        <section class="results-heading">
          <div><h2 id="results-title">0 автомобилей</h2><span>Показатели рассчитаны по текущей выборке</span></div>
          <button id="clear-filters-link" class="text-action hidden">Сбросить условия</button>
        </section>
        <section id="content" class="content"></section>
      </main>
    </div>

    <div id="drawer-overlay" class="drawer-overlay hidden"></div>
    <aside id="vehicle-drawer" class="vehicle-drawer" aria-hidden="true"></aside>

    <div id="save-modal" class="modal-layer hidden" role="dialog" aria-modal="true" aria-labelledby="save-modal-title">
      <div class="modal-card">
        <button class="modal-close" data-action="close-save-modal" aria-label="Закрыть"><svg><use href="#i-x"/></svg></button>
        <h2 id="save-modal-title">Сохранить выборку</h2>
        <p>Текущие условия появятся в умном поиске в разделе «Быстрые выборки».</p>
        <div id="save-filter-summary" class="save-filter-summary"></div>
        <label for="selection-name">Название выборки</label>
        <input id="selection-name" placeholder="Например, Контроль утром" maxlength="60" />
        <div class="modal-actions"><button class="secondary-button" data-action="close-save-modal">Отмена</button><button class="primary-button" id="confirm-save" disabled>Сохранить</button></div>
      </div>
    </div>

    <div id="toast-region" class="toast-region" aria-live="polite"></div>
    <script src="/app.js"></script>
  </body>
</html>
